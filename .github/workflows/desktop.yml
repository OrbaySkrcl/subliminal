name: Masaüstü derlemesi

# Her push'ta testler + Windows/macOS/Linux paketleri (Actions sayfasında "Artifacts" altında).
# "v1.2.0" gibi bir etiket gönderilince paketler GitHub Releases'e de eklenir.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'index.html'
      - 'overlay.html'
      - 'css/**'
      - 'js/**'
      - 'desktop/**'
      - 'build/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Birim testleri
        run: npm test
      - name: Tarayıcı testi (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Masaüstü testi (Electron, Xvfb)
        run: npm run test:desktop

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Paketle
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Esikalti-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
